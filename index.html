<style>
:root{--bg:#eef0ee;--card:#fff;--tx:#101418;--mu:#5d6670;--bd:#dde1de;--ac:#2b4bff;--acx:#fff;--ok:#0f7a55;--okb:#dff3ea;--wn:#9a4a00;--wnb:#ffecd0;--er:#b3202a;--erb:#fde4e4;--acs:rgba(43,75,255,.16);--ac2:#6a3df0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1013;--card:#161b20;--tx:#e9edf0;--mu:#93a0ab;--bd:#262d34;--ac:#8ea0ff;--acx:#0b1030;--ok:#55d3a3;--okb:#11382b;--wn:#ffbd66;--wnb:#3b290e;--er:#ff8f95;--erb:#401a1d;--acs:rgba(142,160,255,.2);--ac2:#b08cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1013;--card:#161b20;--tx:#e9edf0;--mu:#93a0ab;--bd:#262d34;--ac:#8ea0ff;--acx:#0b1030;--ok:#55d3a3;--okb:#11382b;--wn:#ffbd66;--wnb:#3b290e;--er:#ff8f95;--erb:#401a1d;--acs:rgba(142,160,255,.2);--ac2:#b08cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.2px;margin:0}
h1{font-size:30px;line-height:1}
h2{font-size:22px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--bd);margin-bottom:16px}
nav button{background:none;border:0;padding:10px 14px;font:600 15px Barlow,system-ui,sans-serif;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stats .card{margin:0}
.num{font-size:40px;line-height:1;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.active{background:var(--okb);color:var(--ok)}.expiring{background:var(--wnb);color:var(--wn)}.expired{background:var(--erb);color:var(--er)}
button,.btn{font:600 14px Barlow,system-ui,sans-serif;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ac)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:160px}
input,select,textarea{font:15px Barlow,system-ui,sans-serif;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
label{display:block;font-weight:500;margin-bottom:10px}
label input,label select{margin-top:3px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:18px;width:min(460px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sum{background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.inv table{width:100%;border-collapse:collapse;margin:12px 0}
.inv td,.inv th{padding:8px 0;border-bottom:1px solid var(--bd);text-align:left}
.inv td:last-child,.inv th:last-child{text-align:right}
.alert{background:var(--wnb);color:var(--wn);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:22px 4px;color:var(--mu);text-align:center}
.foot{text-align:center;color:var(--mu);font-size:12.5px;padding:18px 12px}
.login{max-width:400px;margin:0 auto;padding:14vh 16px 16px}
.err{color:var(--er);min-height:20px;margin-bottom:8px;font-size:14px}
.lnk{border:0;background:none;padding:0;color:var(--ac);text-decoration:underline}
@media print{.wrap,.login,.foot{display:none}dialog{position:static;border:0;width:100%}.noprint{display:none}}
/* compat */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
textarea,input[type=text],input[type=number],input[type=password],input[type=email],input:not([type]){-webkit-appearance:none;appearance:none;border-radius:6px}
button,.btn,nav button,.seg button{touch-action:manipulation}
dialog:not([open]){display:none}
dialog{max-height:92vh;max-height:92dvh}
dialog.fb[open]{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;margin:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.old{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#111;padding:28px;z-index:99;font:16px/1.5 system-ui,sans-serif}
body.native .webonly{display:none}
body.native .wrap{padding-top:max(28px,env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
/* v3 look */
body{background:radial-gradient(900px 320px at 50% -80px,var(--acs),transparent) no-repeat,var(--bg)}
.top{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acx);border-radius:18px;padding:20px 22px;align-items:center;box-shadow:0 14px 30px -18px var(--ac)}
.top h1{font-size:34px}.top .mu{color:inherit;opacity:.85}
.top button{background:transparent;color:inherit;border-color:currentColor}
nav{border:0;gap:8px;padding-bottom:4px}
nav button{border:1px solid var(--bd);border-radius:99px;background:var(--card);margin:0;padding:8px 18px;transition:.15s}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);box-shadow:0 6px 14px -8px var(--ac)}
.card{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 24px -18px rgba(0,0,0,.3)}
.stats .card{position:relative;overflow:hidden;padding-left:20px}
.stats .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--ac))}
.stats .card:nth-child(1){--c:var(--ok)}.stats .card:nth-child(2){--c:var(--wn)}.stats .card:nth-child(3){--c:var(--er)}
button,.btn{transition:.15s}.pri{box-shadow:0 6px 14px -8px var(--ac)}
.who{position:relative;padding-left:46px;min-height:36px}
.av{position:absolute;left:0;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 17px "Barlow Condensed",system-ui,sans-serif;background:var(--acs);color:var(--ac)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;border-radius:99px;background:none;padding:6px 15px}.seg button.on{background:var(--ac);color:var(--acx)}
.meter{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{font-weight:600;color:var(--mu);font-size:13px}
@media (max-width:560px){nav{flex-wrap:wrap}.num{font-size:32px}.top h1{font-size:28px}}
@media print{body.pr{--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#ccc;--ac:#2b4bff;background:#fff;color:#111}body.pr .wrap{display:block}body.pr nav,body.pr .top,body.pr #licbar{display:none}}
</style>
</head>
<body>
<div id="oldbrowser" class="old" hidden><h2>Your browser can’t run this app</h2><p>Please use the latest Chrome, Safari or Samsung Internet. Open the link with https and switch off private or incognito mode.</p></div>
<script>window.__ok=false;setTimeout(function(){if(!window.__ok){document.getElementById('oldbrowser').hidden=false}},4000)</script>
<div class="wrap">
  <div class="top"><div><h1 id="gym">My Gym</h1><div class="mu">Memberships, reminders and bills</div></div><button onclick="logout()">Log out</button></div>
  <div id="warn"></div>
  <div id="licbar"></div>
  <nav>
    <button data-t="dash" onclick="go('dash')">Dashboard</button>
    <button data-t="members" onclick="go('members')">Members</button>
    <button data-t="inv" onclick="go('inv')">Bills</button>
    <button data-t="rep" onclick="go('rep')">Reports</button>
    <button data-t="set" onclick="go('set')">Settings</button>
  </nav>
  <main id="main"></main>
</div>
<div class="login" id="login" hidden></div>
<div class="foot" id="foot"></div>
<dialog id="dlg"></dialog>
<script>
window.__ok=!!(window.crypto&&crypto.subtle&&window.fetch&&window.Promise);
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());if(NATIVE)document.body.classList.add('native');
(function(){const d=document.createElement('dialog');if(typeof d.showModal==='function')return;const e=document.getElementById('dlg');e.className='fb';e.showModal=function(){this.setAttribute('open','')};e.close=function(){this.removeAttribute('open')}})();
const $=s=>document.querySelector(s);
/* ===== YOUR DETAILS: change name and phone below before you sell ===== */
const BRAND={name:'HGGymDesk',phone:'9156873641',year:2026};
/* ===== FIREBASE DATABASE: the app tries the three regions Firebase offers and remembers the one that works ===== */
const DB_NAME='hggymdesk-b27e6-default-rtdb';
const DB_HOSTS=['https://'+DB_NAME+'.firebaseio.com','https://'+DB_NAME+'.europe-west1.firebasedatabase.app','https://'+DB_NAME+'.asia-southeast1.firebasedatabase.app'];
let _base='';
async function base(){if(_base)return _base;for(const h of DB_HOSTS){try{const r=await fetch(h+'/licences/ping.json',{cache:'no-store'});if(r.ok){_base=h;return h}}catch(e){}}throw new Error('database not found')}
const MAX_DEVICES=2;
const EXPIRY_ON=false; /* keys work with no end date. Set true to enforce yearly expires dates from Firebase */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PL={1:'1 month',3:'3 months',6:'6 months',12:'1 year'};
let S={settings:{gym:'My Gym',phone:'',cc:'91',cur:'₹',rd:7,prices:{1:1500,3:4000,6:7000,12:12000}},members:[],invoices:[],seq:1};
let tab='dash',q='',flt='all';
function load(){try{const r=localStorage.getItem('gymdesk');if(r){const o=JSON.parse(r);S={...S,...o,settings:{...S.settings,...o.settings,prices:{...S.settings.prices,...(o.settings||{}).prices}}}}}catch(e){}}
function saveLocal(){try{localStorage.setItem('gymdesk',JSON.stringify(S))}catch(e){}}
let schedTm=null;
function save(){saveLocal();if(cloudOn()){const st=sy();st.pending=true;sySave(st);cloudSoon()}if(NATIVE){clearTimeout(schedTm);schedTm=setTimeout(scheduleRenewals,5000)}}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
function endDate(s,n){const d=pd(s),day=d.getDate(),e=new Date(d.getFullYear(),d.getMonth()+n,day);if(e.getDate()!==day)e.setDate(0);return addDays(iso(e),-1)}
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmtD=s=>pd(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const money=n=>S.settings.cur+Number(n).toLocaleString();
const left=m=>diff(m.end,today());
const status=m=>{const l=left(m);return l<0?'expired':l<=S.settings.rd?'expiring':'active'};
const wa=(p,t)=>{let d=String(p).replace(/\D/g,'');if(d.length<=10)d=S.settings.cc+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(t)};
const msgC=m=>{const l=left(m);return `Hi ${m.name}, this is ${S.settings.gym}. Your membership ${l<0?'expired on '+fmtD(m.end):'is valid till '+fmtD(m.end)+' ('+l+' day'+(l==1?'':'s')+' left)'}. Please renew to keep your workouts going!`};
const badge=m=>{const s=status(m),l=left(m);return `<span class="badge ${s}">${s=='expired'?'Expired '+(-l)+'d ago':l==0?'Ends today':l+'d left'}</span>`};

function go(t){tab=t;render()}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  $('#gym').textContent=S.settings.gym||'My Gym';
  $('#warn').innerHTML=storeOK()?'':'<div class="alert"><span><b>Your browser is not saving data.</b> Members and bills will be lost when you close this page. Leave private or incognito mode and allow site data for this page.</span></div>';
  $('#warn').innerHTML+=conflictBar();
  $('#main').innerHTML=V[tab]();
  if(tab=='members')renderList();
}
function mrow(m,full){
  return `<div class="row"><div class="who"><span class="av">${esc((m.name.trim()[0]||'?').toUpperCase())}</span><b>${esc(m.name)}</b><div class="mu">${esc(m.phone)}, ${PL[m.plan]}, ends ${fmtD(m.end)}</div></div>
  <div class="act">${badge(m)}<a class="btn" target="_blank" rel="noopener" href="${wa(m.phone,msgC(m))}">Remind</a><button onclick="openForm('${m.id}')">Renew</button>${full?`<button onclick="del('${m.id}',this)">Delete</button>`:''}</div></div>`;
}
const V={
dash(){
  const ms=S.members,mo=today().slice(0,7);
  const ex=ms.filter(m=>status(m)=='expiring').length,xp=ms.filter(m=>status(m)=='expired').length;
  const rev=S.invoices.filter(i=>i.date.startsWith(mo)).reduce((s,i)=>s+i.total,0);
  const need=ms.filter(m=>left(m)<=S.settings.rd&&left(m)>=-30).sort((a,b)=>a.end<b.end?-1:1);
  const sum=`${S.settings.gym}: memberships needing renewal\n`+need.map(m=>`${m.name} (${m.phone}): ${left(m)<0?'expired '+fmtD(m.end):'ends '+fmtD(m.end)}`).join('\n');
  const owner=S.settings.phone?`<a class="btn pri" target="_blank" rel="noopener" href="${wa(S.settings.phone,sum)}">Send list to owner</a>`:`<button onclick="go('set')">Add owner number</button>`;
  return `<div class="stats">
   <div class="card"><div class="num">${ms.length-xp}</div><div class="mu">Active members</div></div>
   <div class="card"><div class="num">${ex}</div><div class="mu">Ending within ${S.settings.rd} days</div></div>
   <div class="card"><div class="num">${xp}</div><div class="mu">Expired</div></div>
   <div class="card" style="cursor:pointer" onclick="go('rep')"><div class="num">${money(rev)}</div><div class="mu">Collected this month, tap for reports</div></div></div>
   ${need.length?`<div class="alert"><span><b>${need.length} membership${need.length>1?'s':''} need${need.length>1?'':'s'} a renewal reminder.</b></span>${owner}</div>`:''}
   ${S.members.length&&(!S.lastBackup||diff(today(),S.lastBackup)>7)?`<div class="alert"><span><b>Back up your members and bills.</b> ${S.lastBackup?'Your last backup was '+diff(today(),S.lastBackup)+' days ago.':'You haven’t made a backup yet.'}</span><button onclick="go('set')">Back up now</button></div>`:''}
   <div class="card"><h2>Renewals due</h2>${need.length?need.map(m=>mrow(m)).join(''):'<div class="empty">Nobody is due for renewal right now.</div>'}</div>`;
},
members(){
  return `<div class="bar"><input id="q" placeholder="Search by name or phone" value="${esc(q)}" oninput="q=this.value;renderList()">
  <select style="width:auto" onchange="flt=this.value;renderList()">${['all','active','expiring','expired'].map(o=>`<option value="${o}" ${o==flt?'selected':''}>${o[0].toUpperCase()+o.slice(1)}</option>`).join('')}</select>
  <button class="pri" onclick="openForm()">Add member</button></div><div class="card" id="list"></div>`;
},
inv(){
  const l=[...S.invoices].reverse();
  return `<div class="card"><h2>Bills</h2>${l.length?l.map(i=>`<div class="row"><div><b>${i.no}</b>, ${esc(i.name)}<div class="mu">${fmtD(i.date)}, ${PL[i.plan]}, paid by ${i.mode}</div></div><div class="act"><b>${money(i.total)}</b><button onclick="showInv('${i.no}')">View</button></div></div>`).join(''):'<div class="empty">No bills yet. Adding or renewing a member creates one.</div>'}</div>`;
},
set(){
  const s=S.settings,bk=esc(JSON.stringify(S));
  return `<div class="card"><h2>Gym details</h2><div class="g2">
  <label>Gym name<input value="${esc(s.gym)}" onchange="S.settings.gym=this.value;save();render();gymAuth()"></label>
  <label>Owner WhatsApp number<input inputmode="tel" value="${esc(s.phone)}" onchange="S.settings.phone=this.value;save()"></label>
  <label>Country code<input value="${esc(s.cc)}" onchange="S.settings.cc=this.value.replace(/\\D/g,'');save()"></label>
  <label>Currency symbol<input value="${esc(s.cur)}" onchange="S.settings.cur=this.value;save()"></label>
  <label>Remind this many days before expiry<input type="number" min="0" value="${s.rd}" onchange="S.settings.rd=+this.value;save()"></label></div></div>
  <div class="card"><h2>Plan prices</h2><div class="g2">${[1,3,6,12].map(n=>`<label>${PL[n]}<input type="number" min="0" value="${s.prices[n]}" onchange="S.settings.prices[${n}]=+this.value;save()"></label>`).join('')}</div></div>
  <div class="card"><h2>Login</h2><div class="g2"><label>Current password<input id="pw_o" type="password" autocomplete="current-password"></label><label>New password (6+ characters)<input id="pw_n" type="password" autocomplete="new-password"></label></div><div class="act"><button onclick="changePw()">Change password</button><span id="pw_m" class="mu"></span></div></div>
  ${cloudCard()}<div class="card"><h2>Using an iPhone?</h2><p class="mu">Open this page in Safari, tap Share, then Add to Home Screen, and always open the app from that icon. Safari can clear a website’s saved data after about a week of not using it, but apps on the home screen are not affected. Install first, then activate your key and create your login inside the home screen app.</p></div>
  <div class="card"><h2>Backup</h2><p class="mu">Data is stored in this browser only. Copy the text below and keep it safe; paste it back to restore.</p>
  <textarea id="bk" rows="4">${bk}</textarea><div class="act" style="margin-top:8px"><button onclick="copyBk(this)">Copy</button>${(navigator.share||NATIVE)?'<button onclick="shareBk()">Share</button>':''}<button onclick="restore()">Restore from text</button></div></div>`;
}};
/* ===== Reports ===== */
let rep={r:'m',m:today().slice(0,7)};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ml=(end,n)=>{const[y,m]=end.split('-').map(Number);return Array.from({length:n},(_,i)=>ym(new Date(y,m-n+i,1)))};
const mlabel=k=>MN[+k.slice(5)-1]+' '+k.slice(0,4);
const short=v=>v>=1e6?+(v/1e6).toFixed(1)+'M':v>=1e3?+(v/1e3).toFixed(1)+'k':String(v);
const sumT=l=>l.reduce((s,i)=>s+i.total,0);
function repData(){
  const cur=rep.r=='m'?[rep.m]:ml(today().slice(0,7),+rep.r),pv=ml(ml(cur[0],2)[0],cur.length);
  const fi={};S.invoices.forEach(i=>{if(!fi[i.mid]||i.no<fi[i.mid])fi[i.mid]=i.no});
  const sel=a=>S.invoices.filter(i=>a.includes(i.date.slice(0,7)));
  const A=sel(cur),P=sel(pv);let labels,vals;
  if(rep.r=='m'){const[y,m]=rep.m.split('-').map(Number),dn=new Date(y,m,0).getDate();labels=Array.from({length:dn},(_,i)=>i+1);vals=labels.map(d=>sumT(A.filter(i=>+i.date.slice(8)==d)))}
  else{labels=cur.map(k=>MN[+k.slice(5)-1]);vals=cur.map(k=>sumT(A.filter(i=>i.date.startsWith(k))))}

  if(s=='revoked')lockOut('This licence is now in use on another device, or it was cancelled. Enter your key to use it here.',1);
  else if(s=='locked')lockOut('Connect to the internet to confirm your licence.');
  else if(s=='expired')expiredLock();
  else if(s=='ok'&&expLocked)boot();
  else licBar();
}
setInterval(hb,300000);document.addEventListener('visibilitychange',hb);
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',enc(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
function foot(){const e=vexp();$('#foot').innerHTML=`© ${BRAND.year} ${esc(BRAND.name)}. Licensed for one gym only.${e?' Licence valid until '+fmtD(e)+'.':''} <button class="lnk" onclick="showTerms()">Licence terms</button>`}
async function boot(){
  expLocked=false;foot();
  try{lic=lic||JSON.parse(localStorage.getItem(LK))}catch(e){}
  if(!lic||!lic.h){lic=null;showLicence();return}
  const st=await verify();
  if(st=='revoked'){lockOut('This licence is now in use on another device, or it was cancelled. Enter your key to use it here.',1);return}
  if(st=='locked'){lockOut('Connect to the internet to confirm your licence.');return}
  if(st=='expired'){expiredLock();return}
  if(!getAuth())await cloudAuthDown();
  getAuth()&&sess()?enter():showLogin();
}
function showLicence(msg,extra){
  const L=$('#login');document.querySelector('.wrap').hidden=true;L.hidden=false;
  L.innerHTML=`<h1>Activate ${esc(BRAND.name)}</h1><p class="mu">Enter the licence key you received from ${esc(BRAND.name)}.</p>
  <div class="card"><label>Licence key<input id="k_k" placeholder="GYM-XXXX-XXXX-XXXX" autocapitalize="characters" onkeydown="if(event.key==='Enter')doLicence()"></label><div id="k_e" class="err"></div><button class="pri" onclick="doLicence()">Activate</button></div>
  <p class="mu">No key? Contact ${esc(BRAND.name)}, ${esc(BRAND.phone)}.</p>`;
  $('#k_k').focus();if(msg)$('#k_e').textContent=msg;if(extra)L.insertAdjacentHTML('beforeend',extra);
}
async function doLicence(){
  const k=$('#k_k').value.toUpperCase().replace(/\s/g,''),e=$('#k_e');
  e.textContent='Checking…';
  try{
    const h=await sha(k),L=await rt(h);
    if(!L||!L.active){e.textContent='That key isn’t valid or has been cancelled.';return}
    const dev=devId(),now=Date.now(),d={...(L.devices||{})};d[dev]=now;
    const ids=Object.keys(d).sort((a,b)=>d[a]-d[b]);while(ids.length>MAX_DEVICES)delete d[ids.shift()];
    const body=JSON.stringify(d);
    try{await rt(h+'/devices',{method:'PUT',body})}catch(x){if(!(x instanceof TypeError))throw x;await rt(h+'/devices',{method:'POST',body},'?x-http-method-override=PUT')}
    lic={h,ok:now};saveLic();boot();
  }catch(x){e.textContent='Couldn’t reach the licence server ('+((x&&x.message)||'network')+'). Check your internet and try again.'}
}
function showTerms(){
  $('#dlg').innerHTML=`<h2>Licence terms</h2><p>This software is licensed to you, not sold. © ${BRAND.year} ${esc(BRAND.name)}.</p>
  <ol><li>You may use one copy for one gym business.</li><li>You may not copy, resell, rent, share or give access to this software to anyone else, or remove this notice.</li><li>The software is provided as it is. Your data is stored in your own browser, so keep regular backups. To the extent the law allows, ${esc(BRAND.name)} is not responsible for lost data.</li><li>The licence ends if these terms are broken.</li></ol>
  <p class="mu">Questions: ${esc(BRAND.phone)}</p><div class="act"><button class="pri" onclick="$('#dlg').close()">Close</button></div>`;
  $('#dlg').showModal();
}
function enter(){$('#login').hidden=true;document.querySelector('.wrap').hidden=false;render();licBar();cloudCheck();scheduleRenewals();syncGym()}
function logout(){setSess(false);tab='dash';boot()}
function showLogin(){
  const a=getAuth(),L=$('#login');document.querySelector('.wrap').hidden=true;L.hidden=false;
  L.innerHTML=a?`<h1>${esc((a&&a.gym)||S.settings.gym)}</h1><p class="mu">Log in to manage memberships and bills.</p>
  <div class="card"><label>Username<input id="l_u" autocomplete="username"></label><label>Password<input id="l_p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label><div id="l_e" class="err"></div><button class="pri" onclick="doLogin()">Log in</button></div>
  <p class="mu">Forgot your password? <button class="lnk" onclick="forgot(this)">Reset your login</button></p>`
  :`<h1>Welcome to ${esc(BRAND.name)}</h1><p class="mu">Create the owner login for this device. Only people with this password can open the app.</p>
  <div class="card"><label>Gym name<input id="l_g" value="${esc(S.settings.gym==='My Gym'?'':S.settings.gym)}"></label><label>Username<input id="l_u" autocomplete="username"></label><label>Password (6+ characters)<input id="l_p" type="password" autocomplete="new-password"></label><label>Confirm password<input id="l_c" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSetup()"></label><div id="l_e" class="err"></div><button class="pri" onclick="doSetup()">Create login</button></div>`;
  ($('#l_g')||$('#l_u')).focus();
}
async function doSetup(){
  const g=$('#l_g').value.trim(),u=$('#l_u').value.trim(),p=$('#l_p').value,c=$('#l_c').value,e=$('#l_e');
  if(!u){e.textContent='Choose a username.';return}
  if(p.length<6){e.textContent='Use a password with at least 6 characters.';return}
  if(p!==c){e.textContent='The two passwords don’t match.';return}
  try{const salt=b64(crypto.getRandomValues(new Uint8Array(16)));setAuth({user:u,salt,hash:await hash(p,salt),gym:g||S.settings.gym});
  if(g)S.settings.gym=g;save();setSess(true);enter()}catch(x){e.textContent='This browser can’t create a secure login. Try Chrome or Safari.'}
}
async function doLogin(){
  const a=getAuth(),u=$('#l_u').value.trim(),e=$('#l_e');
  try{const h=await hash($('#l_p').value,a.salt);
  if(u.toLowerCase()===a.user.toLowerCase()&&h===a.hash){setSess(true);enter()}else e.textContent='Wrong username or password.'}
  catch(x){e.textContent='Login isn’t supported in this browser. Try Chrome or Safari.'}
}
async function changePw(){
  const a=getAuth(),m=$('#pw_m'),n=$('#pw_n').value;
  try{if(n.length<6){m.textContent='New password needs 6+ characters.';return}
  if(await hash($('#pw_o').value,a.salt)!==a.hash){m.textContent='Current password is wrong.';return}
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));setAuth({user:a.user,salt,hash:await hash(n,salt),gym:a.gym});
  $('#pw_o').value='';$('#pw_n').value='';cloudAuthUp();m.textContent='Password changed.'}catch(x){m.textContent='Couldn’t change the password in this browser.'}
}
function gymAuth(){const a=getAuth();if(a){a.gym=S.settings.gym;setAuth(a);cloudAuthUp()}}
function syncGym(){const a=getAuth();if(a&&S.settings.gym&&S.settings.gym!=='My Gym'&&a.gym!==S.settings.gym){a.gym=S.settings.gym;setAuth(a);cloudAuthUp()}}
function showReset(){
  const L=$('#login'),a=getAuth()||{};
  L.innerHTML=`<h1>Reset your login</h1><p class="mu">Enter your licence key and choose a new gym name, username and password. Your members and bills are kept.</p>
  <div class="card"><label>Licence key<input id="r_k" placeholder="GYM-XXXX-XXXX-XXXX" autocapitalize="characters"></label>
  <label>Gym name<input id="r_g" value="${esc(a.gym||(S.settings.gym==='My Gym'?'':S.settings.gym))}"></label>
  <label>New username<input id="r_u" autocomplete="username"></label>
  <label>New password (6+ characters)<input id="r_p" type="password" autocomplete="new-password"></label>
  <label>Confirm new password<input id="r_c" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doReset()"></label>
  <div id="r_e" class="err"></div><div class="act"><button class="pri" onclick="doReset()">Reset login</button><button onclick="showLogin()">Back</button></div></div>`;
  $('#r_k').focus();
}
async function doReset(){
  const e=$('#r_e'),k=$('#r_k').value.toUpperCase().replace(/\s/g,''),g=$('#r_g').value.trim(),u=$('#r_u').value.trim(),p=$('#r_p').value,c=$('#r_c').value;
  if(!k){e.textContent='Enter your licence key.';return}
  if(!u){e.textContent='Choose a username.';return}
  if(p.length<6){e.textContent='Use a password with at least 6 characters.';return}
  if(p!==c){e.textContent='The two passwords don’t match.';return}
  e.textContent='Checking…';
  try{
    if(await sha(k)!==lic.h){e.textContent='That licence key doesn’t match this gym.';return}
    try{const meta=await rr(cb()+'/meta');if(meta&&meta.t>(sy().t||0)&&!(S.members.length||S.invoices.length))await cloudDown(meta)}catch(x){}
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
    if(g)S.settings.gym=g;
    setAuth({user:u,salt,hash:await hash(p,salt),gym:S.settings.gym});
    save();await cloudAuthUp();setSess(true);enter();
  }catch(x){e.textContent='Couldn’t reset the login ('+((x&&x.message)||'error')+'). Check your internet and try again.'}
}
function forgot(b){if(lic){showReset();return}if(b.dataset.c){try{localStorage.removeItem('gymdesk');localStorage.removeItem(AK);sessionStorage.removeItem('gd_in')}catch(e){}location.reload()}else{b.dataset.c=1;b.textContent='This erases all members and bills. Click again to confirm'}}
load();boot();
</script>
